plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = project.mod_version
group = project.maven_group
base { archivesName = "better-brewing-fuels-neoforge-${project.minecraft_version}" }

java.toolchain.languageVersion = JavaLanguageVersion.of(21)
sourceSets.main.java.srcDir('../shared/src/main/java')
sourceSets.main.resources.srcDir('../shared/src/main/resources')

neoForge {
    version = project.neo_version
    runs {
        client { client() }
        server { server(); programArgument '--nogui' }
    }
    mods {
        brewing_fuel_expansion { sourceSet(sourceSets.main) }
    }
}

processResources {
    inputs.property 'version', project.version
    filesMatching('META-INF/neoforge.mods.toml') {
        expand 'version': project.version
    }
}
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}
