name: Build Forge 1.21.1
on:
  workflow_dispatch:
  push:
    branches: ['main']
    paths:
      - 'shared/**'
      - 'forge/**'
      - '.github/workflows/build-forge-1.21.1.yml'
  pull_request:
    paths:
      - 'shared/**'
      - 'forge/**'
      - '.github/workflows/build-forge-1.21.1.yml'

jobs:
  forge:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            8
            21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.0'
      - name: Build Forge 1.21.1
        run: gradle -p forge clean build --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: better-brewing-fuels-forge-1.21.1
          path: forge/build/libs/*.jar
          if-no-files-found: error
