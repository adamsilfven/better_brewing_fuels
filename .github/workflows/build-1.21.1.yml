name: Build both 1.21.1 loaders
on:
  workflow_dispatch:
  push:
    branches: ['main', 'master']
    paths:
      - 'shared/**'
      - 'fabric/**'
      - 'neoforge/**'
      - 'tools/**'
      - '.github/workflows/build-1.21.1.yml'
  pull_request:
    paths:
      - 'shared/**'
      - 'fabric/**'
      - 'neoforge/**'
      - 'tools/**'
      - '.github/workflows/build-1.21.1.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        loader: [fabric, neoforge]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.4'
      - name: Syntax and fuel value smoke test (offline stubs)
        run: python3 tools/smoke_test.py
      - name: Build ${{ matrix.loader }}
        run: gradle -p "${{ matrix.loader }}" clean build --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: better-brewing-fuels-${{ matrix.loader }}-1.21.1
          path: ${{ matrix.loader }}/build/libs/*.jar
          if-no-files-found: error
